session_name: obstacle_tracker_tmux 
windows: 
  - windo_name: main 
    layout: tiled 
    shell_command_before: 
      - source ~/code/tracker_ws/install/setup.bash 
    panes: 
      # LiDAR drivers
      - shell_command: 
        - source ~/code/livox_ws/install/setup.bash 
        - ros2 launch livox_ros_driver2 run_MID360_launch.py namespace:=$VEH_NAME
      
      # LiDAR odometry module 
      - shell_command: 
        - source ~/code/dlio_ws/install/setup.bash  
        - ros2 launch direct_lidar_inertial_odometry dlio.launch.py namespace:=$VEH_NAME 
      
      # Mapping and dynamic object tracking 
      - shell_command: 
        - source ~/code/decomp_ws/install/setup.bash
        # - ros2 launch global_mapper_ros global_mapper_node.launch.py namespace:=$VEH_NAME depth_pointcloud_topic:=livox/lidar_ds use_tracker:=true publish_init_tf:=false
        - ros2 launch global_mapper_ros global_mapper_node.launch.py namespace:=$VEH_NAME depth_pointcloud_topic:=dlio/odom_node/pointcloud/deskewed use_tracker:=true publish_init_tf:=false
      
      # MAVROS 
      - shell_command: 
        - ros2 launch mavros px4.launch namespace:=PX05/mavros tgt_system:=$MAV_SYS_ID
      
      # MAVROS interface 
      - shell_command: 
        - source ~/code/dynus_ws/install/setup.bash 
        - source ~/code/get_init_pose.sh && ros2 launch ros2_px4_stack dynus_mavros.launch.py odom_type:=livox
      
      # Zenoh router 
      - shell_command: 
        - zenoh_router
      
      # Record data 
      - shell_command: 
        - cd ~/data/tracker 
        - ros2 bag record PX05/world PX05/mocap/twist PX05/dlio/odom_node/pose PX05/cluster_bounding_boxes PX05/tracked_obstacles tf tf_static PX05/occupancy_grid PX05/dynamic_grid PX05/livox/lidar PX05/livox/imu HELMET1/world