session_name: obstacle_tracker_tmux 
windows: 
  - windo_name: main 
    layout: tiled 
    shell_command_before: 
      - source ~/code/tracker_ws/install/setup.bash 
    panes: 
      # Mapping & Tracking
      - shell_command: 
        - source ~/code/decomp_ws/install/setup.bash 
        - ros2 launch global_mapper_ros global_mapper_node.launch.py namespace:=$ROVER_NAME depth_pointcloud_topic:=livox/lidar_ds use_tracker:=true pose_topic:=dlio/odom_node/pose param_file:=rover.yaml
      # Downsampling
      - shell_command: 
        - ros2 launch pc_preprocess preprocess.launch.py quad:=$ROVER_NAME depth_pointcloud_topic:=livox/lidar_ds
      # Livox 
      - shell_command:
        - source /home/swarm/code/livox_ws/install/setup.bash
        - ros2 launch livox_ros_driver2 run_MID360_launch.py namespace:=$ROVER_NAME
      # DLIO 
      - shell_command:
        - source /home/swarm/code/dynus_ws/install/setup.bash
        - ros2 launch direct_lidar_inertial_odometry dlio.launch.py namespace:=$ROVER_NAME
      # Static TF
      - shell_command:
        - source /home/swarm/code/dynus_ws/install/setup.bash
        - ros2 run tf2_ros static_transform_publisher 0 0 0 0 0.3490659 0 $ROVER_NAME/base_link $ROVER_NAME/lidar
