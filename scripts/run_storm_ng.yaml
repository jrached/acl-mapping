session_name: storm_ng_tmux 
windows: 
  - windo_name: main 
    layout: tiled 
    shell_command_before: 
      - export VEH_NAME=PX05
      - source ~/code/storm/tracker_ws/install/setup.bash 
    panes: 
      - shell_command: 
        - ros2 launch global_mapper_ros global_mapper_node.launch.py namespace:=$VEH_NAME depth_pointcloud_topic:=livox/lidar use_tracker:=true init_x:=1.030 init_y:=-3.257 init_z:=0.750 init_yaw:=-0.0062990 init_pitch:=0.026865 init_roll:=0.002606
      - shell_command: 
        - rviz2 -d ~/code/storm/tracker_ws/src/acl-mapping/global_mapper_ros/rviz/storm.rviz 