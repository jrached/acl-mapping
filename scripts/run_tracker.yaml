session_name: obstacle_tracker_tmux 
windows: 
  - windo_name: main 
    layout: tiled 
    shell_command_before: 
      - source ~/code/tracker_ws/install/setup.bash 
    panes: 
      - shell_command: 
        - source ~/code/decomp_ws/install/setup.bash 
        - ros2 launch global_mapper_ros global_mapper_node.launch.py namespace:=$VEH_NAME depth_pointcloud_topic:=livox/lidar_ds use_tracker:=true
      - shell_command: 
        - ros2 launch pc_preprocess preprocess.launch.py quad:=$VEH_NAME depth_pointcloud_topic:=livox/lidar_ds
      - shell_command: 
        - cd ~/code/gridnet_docker
        - ./run.sh